name: Deploy to GitHub Pages

# Push trigger disabled while GitHub Pages activation is blocked account-wide
# (see README / GitHub Support ticket). Vercel auto-deploys pushes meanwhile.
# Re-enable the push trigger once Pages works: run `gh workflow run deploy-pages.yml` to test.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
